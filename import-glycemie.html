async function importerTout() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const bar = document.getElementById('progress-bar');
  btn.disabled = true;
  
  const batchSize = 100;
  let total = 0;
  
  for (let i = 0; i < mesures.length; i += batchSize) {
    const batch = mesures.slice(i, i + batchSize);
    try {
      const r = await fetch(SUPA_URL + '/rest/v1/fitplan_glyco', {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': 'Bearer ' + SUPA_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(batch)
      });
      if (r.ok) {
        total += batch.length;
      } else {
        const err = await r.text();
        status.innerHTML = '<span style="color:#ff6b6b;">Erreur: ' + err.substring(0,100) + '</span>';
        btn.disabled = false;
        return;
      }
    } catch(e) {
      status.innerHTML = '<span style="color:#ff6b6b;">Erreur réseau: ' + e.message + '</span>';
      btn.disabled = false;
      return;
    }
    
    const pct = Math.round(total / mesures.length * 100);
    bar.style.width = pct + '%';
    status.textContent = total + ' / ' + mesures.length + ' mesures importées...';
    await new Promise(r => setTimeout(r, 50));
  }
  
  status.innerHTML = '<span style="color:#2dc653;font-weight:700;">✅ ' + total + ' mesures importées avec succès !</span><br><span style="color:#777;font-size:12px;">Tu peux fermer cette page et rafraîchir FitPlan.</span>';
}
